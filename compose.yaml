services:
  scoutfootball:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${SCOUTFOOTBALL_PYTHON_IMAGE:-python:3.11-slim}
        INSTALL_SYSTEM_PACKAGES: ${SCOUTFOOTBALL_INSTALL_SYSTEM_PACKAGES:-1}
    image: scoutfootball:local
    ports:
      - "8000:8000"
    environment:
      SCOUTFOOTBALL_DATA_ROOT: /app/data
      SCOUTFOOTBALL_CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
