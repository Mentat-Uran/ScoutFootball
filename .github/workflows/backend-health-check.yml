name: Backend health check

on:
  schedule:
    # Every 6 hours at minute 0
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: backend-health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check Render backend health
        id: health
        run: |
          ENDPOINT="https://scoutfootball-for-world-cup.onrender.com/health"
          echo "Checking $ENDPOINT ..."

          # Render free tier may need up to 60s to wake up
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 90 "$ENDPOINT") && STATUS="ok" || STATUS="fail"
          echo "HTTP status: $HTTP_CODE"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" != "ok" ]; then
            echo "::warning::Backend health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Check key API endpoints
        id: endpoints
        if: steps.health.outputs.status == 'ok'
        run: |
          BASE="https://scoutfootball-for-world-cup.onrender.com"
          FAILED=""

          for EP in "/ratings/meta" "/teams" "/predictions/meta"; do
            CODE=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 30 "$BASE$EP") || CODE="000"
            echo "$EP -> HTTP $CODE"
            if [ "$CODE" != "200" ]; then
              FAILED="$FAILED $EP($CODE)"
            fi
          done

          if [ -n "$FAILED" ]; then
            echo "::warning::Some endpoints returned non-200:$FAILED"
            echo "failed_endpoints=$FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "All endpoints OK"

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // Avoid duplicate open issues
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'backend-down',
              per_page: 1
            });
            if (existing.data.length > 0) {
              console.log('Open backend-down issue already exists, skipping.');
              return;
            }

            const date = new Date().toISOString().slice(0, 19) + ' UTC';
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Backend health check failed — ${date}`,
              body: `The Render backend health check failed.\n\n- Health endpoint: HTTP ${{ steps.health.outputs.http_code || 'unreachable' }}\n- Failed endpoints: ${{ steps.endpoints.outputs.failed_endpoints || 'N/A' }}\n\n[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['automation', 'backend-down']
            });

      - name: Close issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'backend-down'
            });
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Backend recovered at ${new Date().toISOString().slice(0, 19)} UTC. Closing.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
