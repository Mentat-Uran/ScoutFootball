name: Brief CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  brief:
    name: brief
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Check frontend syntax
        run: node --check frontend/app.js

  windows-lan-launcher:
    name: windows-lan-launcher
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run LAN launcher contract tests
        run: |
          python -m pip install pytest
          python -m pytest tests/unit/test_windows_lan_launcher_contract.py -q

      - name: Run firewall rule lookup behavior contract
        shell: pwsh
        run: ./tests/windows/test_firewall_rule_lookup.ps1

      - name: Parse Windows launcher PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/start-lan.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw "PowerShell parse failed: $($errors.Message -join '; ')" }
