name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: windows-latest
            build_cmd: powershell -File scripts/build-desktop-windows.ps1
          - os: macos-latest
            build_cmd: bash scripts/build-desktop.sh --mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync

      - name: Run data pipeline
        continue-on-error: true
        shell: bash
        run: |
          uv run python -m scoutfootball ingest || true
          uv run python -m scoutfootball build-features || true
          uv run python -m scoutfootball train || true

      - name: Ensure data directories exist for packaging
        shell: bash
        run: |
          # electron-builder extraResources requires these directories to exist
          mkdir -p data/gold/feature_store
          mkdir -p data/models
          mkdir -p data/reports
          mkdir -p data/raw/statsbomb_open
          # Create placeholder files so the directories aren't empty (needed for some packagers)
          touch data/gold/feature_store/.gitkeep
          touch data/models/.gitkeep
          touch data/reports/.gitkeep
          touch data/raw/statsbomb_open/.gitkeep
          # Create duckdb placeholder if not exists (use uv run to ensure duckdb is available)
          if [ ! -f data/gold/scoutlab.duckdb ]; then
            uv run python -c "import duckdb; duckdb.connect('data/gold/scoutlab.duckdb').close(); print('Created empty scoutlab.duckdb')" 2>/dev/null || touch data/gold/scoutlab.duckdb
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron dependencies
        run: cd desktop && npm install

      - name: Build desktop app
        run: ${{ matrix.build_cmd }}
        env:
          # Skip macOS code signing in CI (no certificate available)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          retention-days: 7

  create-release:
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Generate version tag
        id: version
        run: |
          VERSION="v$(date +%Y%m%d.%H%M%S)-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body: |
            ## ScoutFootball Desktop ${{ steps.version.outputs.tag }}

            Automated release from main branch merge.

            ### Changes
            - Commit: ${{ github.sha }}
            - Merged by: ${{ github.actor }}
            - PR: #${{ github.event.pull_request.number }}

            ### Assets
            - Windows: `.exe` installer
            - macOS: `.dmg` disk image
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.blockmap
            artifacts/**/latest*.yml
            docs/USER_GUIDE.md
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
