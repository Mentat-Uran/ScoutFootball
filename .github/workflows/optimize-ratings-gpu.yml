name: Optimize ratings GPU artifacts

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-ratings-gpu-artifacts
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run full rating optimization
        env:
          MPLBACKEND: Agg
          PYTHONPATH: src
        run: |
          uv run python scripts/optimize_ratings_gpu.py --data_dir ./data --no-viz

      - name: Copy generated feature-store artifacts to sample
        run: |
          mkdir -p data/sample
          find data/gold/feature_store -maxdepth 1 -type f -print -exec cp -f {} data/sample/ \;

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/gold/feature_store data/sample data/models/runs
          git status --short
          if git diff --cached --quiet; then
            echo "No generated artifact changes to commit."
          else
            git commit -m "Update optimized rating artifacts"
            git push
          fi
