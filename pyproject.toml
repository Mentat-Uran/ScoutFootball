[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scoutlab"
version = "0.3.0"
description = "Local-first football data research platform with compliant data sourcing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4,<2.0",
  "fastapi>=0.115,<1.0",
  "lxml>=5.3,<6.0",
  "matplotlib>=3.8,<4.0",
  "mplsoccer>=1.4,<2.0",
  "pandas>=2.3,<3.0",
  "plotly>=6.0,<7.0",
  "pydantic>=2.11,<3.0",
  "scikit-learn>=1.6,<2.0",
  "streamlit>=1.45,<2.0",
  "uvicorn>=0.34,<1.0",
]

[project.scripts]
scoutlab = "scoutlab.__main__:main"

[dependency-groups]
dev = [
  "py>=1.11.0",
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/scoutlab/app/pages/*" = ["N999"]
