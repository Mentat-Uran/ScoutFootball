[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scoutfootball"
version = "1.1.1"
description = "ScoutFootball — Local-First Football Analytics & Player Research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4,<2.0",
  "fastapi>=0.115,<1.0",
  "lxml>=5.3,<6.0",
  "matplotlib>=3.8,<4.0",
  "mplsoccer>=1.4,<2.0",
  "pandas>=2.3,<3.0",
  "plotly>=6.0,<7.0",
  "pydantic>=2.11,<3.0",
  "scikit-learn>=1.6,<2.0",
  "scipy>=1.13,<2.0",
  "streamlit>=1.45,<2.0",
  "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
optimizer = ["torch>=2.4,<3.0"]

[project.scripts]
scoutfootball = "scoutfootball.__main__:main"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "playwright>=1.61.0",
  "py>=1.11.0",
  "pyinstaller>=6.20.0",
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
  # Optimizer and team-points MLP tests exercise the optional torch path.
  "torch>=2.4,<3.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
link-mode = "copy"

# The local optimizer/neural-rating path needs CUDA on the maintained Windows
# workstation.  The CUDA wheel still supports CPU execution on machines
# without an NVIDIA device; training code selects the device at runtime.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
addopts = "-q -m \"not e2e\""
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: marks tests as real-browser E2E tests (run explicitly with '-m e2e')",
]
filterwarnings = [
    "ignore:Mean of empty slice:RuntimeWarning",
    "ignore:.*set_tight_layout.*:PendingDeprecationWarning",
    "ignore:lbfgs failed to converge:sklearn.exceptions.ConvergenceWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/scoutfootball/app/pages/*" = ["N999"]
"src/scoutfootball/worldcup/data.py" = ["E501"]
